<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff719a">
<title>❤️ Savollar</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd1df, #ff8eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  overflow-x: hidden;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 25px;
  padding: 25px 20px;
  text-align: center;
  box-shadow: 0 10px 35px #b83b6540;
  position: relative;
  z-index: 1;
}

h1 {
  color: #e7477b;
  font-size: 27px;
}

p {
  color: #777;
  line-height: 1.5;
}

.heart {
  font-size: 55px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

button {
  border: none;
  border-radius: 30px;
  padding: 13px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.start-btn {
  background: #ed4f85;
  color: white;
  width: 100%;
  margin-top: 15px;
}

#quiz, #finish {
  display: none;
}

.progress {
  width: 100%;
  height: 9px;
  background: #ffe0ea;
  border-radius: 20px;
  margin: 20px 0;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #ed4f85;
  transition: width .3s;
}

.question {
  font-size: 23px;
  font-weight: bold;
  color: #d93e73;
  min-height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.arena {
  height: 150px;
  position: relative;
  margin-top: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.answer-btn {
  min-width: 115px;
  color: white;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}

#yesBtn {
  background: #ed4f85;
  left: 8px;
}

#noBtn {
  background: #777;
  right: 8px;
}

.answer-btn:disabled {
  opacity: .6;
}

.small-text {
  font-size: 13px;
  color: #999;
}

.hidden {
  display: none !important;
}

.admin-open {
  position: fixed;
  bottom: 15px;
  right: 15px;
  z-index: 10;
  background: white;
  color: #e7477b;
  border: 2px solid #e7477b;
  padding: 10px 17px;
  box-shadow: 0 3px 12px #0002;
}

.admin-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #0009;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

.admin-window {
  width: 100%;
  max-width: 750px;
  height: 90vh;
  height: 90dvh;
  background: white;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.admin-header {
  min-height: 52px;
  padding: 8px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #e7477b;
  border-bottom: 1px solid #eee;
}

.admin-header button {
  background: #e7477b;
  color: white;
  padding: 8px 14px;
}

.admin-window iframe {
  width: 100%;
  flex: 1;
  border: 0;
  min-height: 0;
}

.floating-heart {
  position: fixed;
  bottom: -30px;
  color: #fff;
  opacity: .7;
  animation: floatUp 6s linear infinite;
  pointer-events: none;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@media(max-width: 480px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 22px 15px;
  }

  h1 {
    font-size: 24px;
  }

  .question {
    font-size: 21px;
  }

  .admin-modal {
    padding: 0;
  }

  .admin-window {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: none;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div id="home">
    <div class="heart">❤️</div>
    <h1>Bir nechta savollarim bor</h1>
    <p>Har bir savolga o‘zing xohlagan javobni tanla 😊</p>
    <button class="start-btn" onclick="startQuiz()">Boshlash ❤️</button>
  </div>

  <div id="quiz">
    <h1>❤️ Savollar</h1>

    <p id="counter">1 / 7</p>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question" id="question"></div>

    <div class="arena" id="arena">
      <button class="answer-btn" id="yesBtn" onclick="next('yes')">
        Ha ❤️
      </button>

      <button class="answer-btn" id="noBtn" onclick="next('no')">
        Yo‘q 💔
      </button>
    </div>

    <p class="small-text">Javobing saqlanadi ❤️</p>
  </div>

  <div id="finish">
    <div class="heart">💖</div>
    <h1>Rahmat! ❤️</h1>
    <p>Barcha savollarga javob berding!</p>
    <p>Javoblaring saqlandi 😊</p>
  </div>

</div>

<button class="admin-open" onclick="openAdmin()">🔐 Admin</button>

<div id="adminModal" class="admin-modal hidden">
  <div class="admin-window">
    <div class="admin-header">
      <b>❤️ Admin kabinet</b>
      <button onclick="closeAdmin()">✖</button>
    </div>

    <iframe id="adminFrame" title="Admin kabinet"></iframe>
  </div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzrCNy1hVZLEx_9PNm-pdSE620YOyNa66s0yNfaVnhPKX-K4Co9kvnxTcNirZK3GHcm/exec";

const questions = [
  {
    q: "Men bilan sayr qilishmi? 🌸",
    yes: "Men bilan sayr",
    no: "O‘zing drama ko‘rish"
  },
  {
    q: "Qayerga boramiz? 🌅",
    yes: "Parkka boramiz",
    no: "Uyda qolaman"
  },
  {
    q: "Birga nima qilamiz? 🎬",
    yes: "Film ko‘ramiz",
    no: "O‘zim ko‘raman"
  },
  {
    q: "Qaysi biri yoqadi? 🎵",
    yes: "Birga musiqa",
    no: "Yolg‘iz musiqa"
  },
  {
    q: "Qanday xotira qoldiramiz? 📸",
    yes: "Birga rasm",
    no: "Rasmga tushmayman"
  },
  {
    q: "Kechqurun nima qilamiz? 🌙",
    yes: "Birga suhbat",
    no: "O‘zim uxlayman"
  },
  {
    q: "Oxirgi savol! 🥹",
    yes: "MEN ❤️",
    no: "COLA 🥤"
  }
];

let current = 0;
let escapedThisQuestion = false;
let sending = false;

const home = document.getElementById("home");
const quiz = document.getElementById("quiz");
const finish = document.getElementById("finish");
const questionElement = document.getElementById("question");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const arena = document.getElementById("arena");

function startQuiz() {
  current = 0;
  home.style.display = "none";
  finish.style.display = "none";
  quiz.style.display = "block";
  showQuestion();
}

function showQuestion() {
  const item = questions[current];

  questionElement.textContent = item.q;

  document.getElementById("counter").textContent =
    (current + 1) + " / " + questions.length;

  document.getElementById("progressBar").style.width =
    (current / questions.length * 100) + "%";

  yesBtn.textContent = item.yes;
  noBtn.textContent = item.no;

  yesBtn.disabled = false;
  noBtn.disabled = false;

  yesBtn.style.left = "8px";
  yesBtn.style.right = "auto";
  yesBtn.style.top = "50%";

  noBtn.style.left = "auto";
  noBtn.style.right = "8px";
  noBtn.style.top = "50%";

  escapedThisQuestion = false;
  sending = false;
}

function runAway() {
  if (escapedThisQuestion || sending) return;

  escapedThisQuestion = true;

  const maxX = Math.max(0, arena.clientWidth - noBtn.offsetWidth);
  const maxY = Math.max(0, arena.clientHeight - noBtn.offsetHeight);

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.right = "auto";
  noBtn.style.top = randomY + "px";
  noBtn.style.transform = "none";
}

// Kompyuterda birinchi marta ustiga olib borilganda qochadi
noBtn.addEventListener("pointerenter", function(event) {
  if (event.pointerType === "mouse") {
    runAway();
  }
});

// Telefonda birinchi bosishda qochadi.
// Ikkinchi bosishda esa javob tanlanadi.
noBtn.addEventListener("pointerdown", function(event) {
  if (event.pointerType === "touch" && !escapedThisQuestion) {
    event.preventDefault();
    runAway();
  }
});

async function next(choice) {
  if (sending) return;

  sending = true;
  yesBtn.disabled = true;
  noBtn.disabled = true;

  const item = questions[current];
  const answer = choice === "yes" ? item.yes : item.no;

  // Javobni Google Sheets ga yuborish
  try {
    await fetch(scriptURL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        question: item.q,
        answer: answer
      })
    });
  } catch (error) {
    console.log("Javob yuborishda xatolik:", error);
  }

  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    quiz.style.display = "none";
    finish.style.display = "block";

    document.getElementById("progressBar").style.width = "100%";
  }
}

// Admin oynasini shu sayt ichida ochish
function openAdmin() {
  const modal = document.getElementById("adminModal");
  const frame = document.getElementById("adminFrame");

  if (!frame.getAttribute("src")) {
    frame.src = scriptURL;
  }

  modal.classList.remove("hidden");
}

function closeAdmin() {
  document.getElementById("adminModal").classList.add("hidden");
}

// Admin oynasining tashqarisini bosganda yopish
document.getElementById("adminModal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeAdmin();
  }
});

// Yurakchalar animatsiyasi
setInterval(function() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.textContent = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";

  document.body.appendChild(heart);

  setTimeout(function() {
    heart.remove();
  }, 6000);
}, 900);
</script>

</body>
</html>
