
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff719a">
<title>Faqat sen uchun ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ff758c,#ff9aaf,#b58add);
}

.card {
  width: 100%;
  max-width: 390px;
  padding: 30px 20px;
  background: rgba(255,255,255,.95);
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 15px 50px #682c6540;
  position: relative;
  z-index: 2;
}

.heart {
  font-size: 48px;
  animation: beat 1s infinite;
  margin-bottom: 12px;
}

@keyframes beat {
  50% { transform: scale(1.18); }
}

h1 {
  color: #e7477b;
  font-size: 25px;
  line-height: 1.3;
  margin-bottom: 12px;
}

p {
  color: #777;
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 22px;
}

button {
  border: none;
  border-radius: 25px;
  padding: 14px 17px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.start, .yes, .no {
  background: linear-gradient(45deg,#ff477e,#ff8ba7);
  color: white;
  box-shadow: 0 5px 15px #ff477e40;
}

.start {
  font-size: 17px;
  padding: 15px 35px;
}

.progress {
  height: 8px;
  width: 100%;
  background: #f5dce6;
  border-radius: 20px;
  margin: 18px 0;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#ff477e,#b58add);
  border-radius: 20px;
  transition: .4s;
}

.counter {
  color: #e7477b;
  font-size: 13px;
  font-weight: bold;
}

.arena {
  height: 125px;
  position: relative;
  width: 100%;
  margin-top: 15px;
}

.yes, .no {
  position: absolute;
  top: 30px;
  width: 46%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.3;
}

.yes {
  left: 0;
}

.no {
  right: 0;
  border: none;
}

.hidden {
  display: none !important;
}

#finish h1 {
  font-size: 28px;
}

.final-text {
  background: #fff0f5;
  border-radius: 18px;
  padding: 18px;
  color: #e7477b;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.6;
}

.emoji {
  position: fixed;
  bottom: -40px;
  pointer-events: none;
  z-index: 1;
  animation: float 6s linear forwards;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@media(max-width:360px) {
  .card {
    padding: 25px 14px;
  }

  h1 {
    font-size: 22px;
  }

  .yes,.no {
    font-size: 12px;
    padding: 12px 8px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="card">

  <section id="home">
    <div class="heart">💗</div>
    <h1>Senga bir nechta savolim bor!</h1>
    <p>Faqat rostini tanla. Oxirigacha yetib borishga tayyormisan? 🥰</p>
    <button class="start" onclick="start()">START ❤️</button>
  </section>

  <section id="quiz" class="hidden">

    <div class="heart">💕</div>
    <div class="counter" id="counter"></div>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <h1 id="question"></h1>
    <p>Tanlovingni kutyapman... 🤭</p>
    <p style="font-size:10px; margin:0;">
      Javoblaring saqlanadi.
    </p>

    <div class="arena" id="arena">
      <button class="yes" id="yes" onclick="next('yes')"></button>
      <button class="no" id="no">❌ Yo‘q</button>
    </div>

  </section>

  <section id="finish" class="hidden">
    <div class="heart">🥹❤️</div>
    <h1>Yashaaa! 🎉</h1>
    <p>Barcha savollarga javob berding!</p>

    <div class="final-text">
      Demak, tanloving MEN! ❤️
      <br><br>
      Endi bu javobni eslab qolaman! 🫶
    </div>

    <br>

    <button class="start" onclick="location.reload()">
      Yana o‘ynash 🔄
    </button>
  </section>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbzrCNy1hVZLEx_9PNm-pdSE620YOyNa66s0yNfaVnhPKX-K4Co9kvnxTcNirZK3GHcm/exec";

const questions = [
  {
    q: "Men bilan sayr qilishmi? 🌸",
    yes: "Men bilan sayr",
    no: "O‘zing drama ko‘rish"
  },
  {
    q: "Qayerga boramiz? 🌅",
    yes: "Parkka boramiz",
    no: "Uyda qolaman"
  },
  {
    q: "Birga nima qilamiz? 🎬",
    yes: "Film ko‘ramiz",
    no: "O‘zim ko‘raman"
  },
  {
    q: "Qaysi biri yoqadi? 🎵",
    yes: "Birga musiqa",
    no: "Yolg‘iz musiqa"
  },
  {
    q: "Qanday xotira qoldiramiz? 📸",
    yes: "Birga rasm",
    no: "Rasmga tushmayman"
  },
  {
    q: "Kechqurun nima qilamiz? 🌙",
    yes: "Birga suhbat",
    no: "O‘zim uxlayman"
  },
  {
    q: "Oxirgi savol! 🥹",
    yes: "MEN ❤️",
    no: "COLA 🥤"
  }
];

let current = 0;

const home = document.getElementById("home");
const quiz = document.getElementById("quiz");
const finish = document.getElementById("finish");
const question = document.getElementById("question");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const arena = document.getElementById("arena");

function start() {
  home.classList.add("hidden");
  quiz.classList.remove("hidden");
  showQuestion();
}

function showQuestion() {
  const q = questions[current];

  question.textContent = q.q;
  yes.textContent = "❤️ " + q.yes;
  no.textContent = "❌ " + q.no;

  document.getElementById("counter").textContent =
    "SAVOL " + (current + 1) + " / " + questions.length;

  document.getElementById("bar").style.width =
    ((current + 1) / questions.length * 100) + "%";

  no.style.left = "auto";
  no.style.right = "0";
  no.style.top = "30px";
}

function next(choice) {
  const q = questions[current];
  const answer = choice === "yes" ? q.yes : q.no;

  fetch(scriptURL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      question: q.q,
      answer: answer
    })
  }).catch(error => console.error(error));

  if (current === questions.length - 1) {
    quiz.classList.add("hidden");
    finish.classList.remove("hidden");
    celebrate();
    return;
  }

  current++;
  showQuestion();
}

function runAway() {
  const maxX = Math.max(0, arena.clientWidth - no.offsetWidth);
  const maxY = Math.max(0, arena.clientHeight - no.offsetHeight);

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  no.style.right = "auto";
  no.style.left = x + "px";
  no.style.top = y + "px";
}

no.addEventListener("pointerenter", function(e) {
  if (e.pointerType === "mouse") {
    runAway();
  }
});

no.addEventListener("touchstart", function(e) {
  e.preventDefault();
  runAway();
}, { passive: false });

function createHeart() {
  const heart = document.createElement("div");

  heart.className = "emoji";
  heart.textContent =
    ["❤️","💗","💕","✨","🌸"][Math.floor(Math.random()*5)];

  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (16 + Math.random()*18) + "px";
  heart.style.animationDuration = (4 + Math.random()*4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 450);

function celebrate() {
  for(let i = 0; i < 35; i++) {
    setTimeout(createHeart, i * 100);
  }
}

</script>

</body>
</html>
